name: Deploy a Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'tests/**'
  workflow_dispatch:

jobs:
  # GATE de regresion: la bateria offline corre ANTES del deploy. Si un test
  # falla, este job queda rojo y el deploy (needs: test) NI ARRANCA. Asi una
  # regresion no puede llegar a produccion, sin depender de que nadie mire el CI.
  # Es el mismo piso offline de test.yml (Python puro, sin LLM ni credenciales).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Correr tests offline (sin LLM, sin credenciales)
        run: pytest -v

  # EL FRENO DE MANO, para juntar cambios y deployar cuando Martin diga
  # (11-ago-2026). Los deploys siguen siendo CHICOS y SEGUIDOS, que es lo que
  # conviene -cuanto mas se junta, mas dificil es saber cual de los cambios
  # rompio algo cuando se prueba en real-. Pero a veces hace falta commitear
  # trabajo a medio terminar sin que salga a produccion, y hasta hoy la unica
  # forma era no pushear, o sea dejar el trabajo colgado en local: justo lo que
  # costo el dia del 3-ago.
  #
  # Con [sin deploy] en el mensaje del commit, el trabajo llega a main -queda
  # respaldado y visible para la sesion siguiente- y el deploy NO corre. Los
  # tests SI corren igual: un commit sin deployar tampoco puede romper el piso.
  # El deploy sale despues, solo, con el primer commit que no lleve la marca, o
  # a mano desde Actions con workflow_dispatch.
  deploy:
    needs: test
    if: "!contains(github.event.head_commit.message, '[sin deploy]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1000939441597/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@memory-engine-v1.iam.gserviceaccount.com

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: memory-engine-v1

      # ADMIN_TOKEN VIAJA EN EL DEPLOY, no se cablea a mano (4-ago-2026).
      #
      # Hasta hoy los endpoints de admin tenian un token por defecto escrito en
      # el codigo, asi que daba igual si la env estaba puesta: siempre habia
      # contraseña. Ahora, sin `ADMIN_TOKEN`, la puerta contesta 503. Si el
      # cableado dependiera de que alguien se acuerde de correr un `gcloud`
      # suelto, se pierde entre sesiones y el admin queda muerto sin que nadie
      # sepa por que.
      #
      # `--update-secrets` es IDEMPOTENTE y solo toca la que se nombra: agrega
      # ADMIN_TOKEN si falta, la deja igual si ya esta, y NO pisa las otras
      # -telegram-token, deepseek-key, sentry-dsn-. Correrlo de mas no rompe nada.
      #
      # Si el deploy falla aca por permisos, es que `github-deployer` no puede
      # leer el secreto. Se arregla con:
      #   gcloud secrets add-iam-policy-binding admin-token \
      #     --member=serviceAccount:github-deployer@memory-engine-v1.iam.gserviceaccount.com \
      #     --role=roles/secretmanager.secretAccessor --project=memory-engine-v1
      # PRODUCCION VA CON LA CLAVE PAGA. EL BANCO, CON LA GRATIS.
      # (Martin, 11-ago-2026, y esto duro medio dia en la otra posicion.)
      #
      # A la mañana se puso la GRATIS en produccion para dejar de gastar, con
      # el numero que yo habia medido: 250.000 tokens de entrada por minuto.
      # ESE NUMERO ERA EL TECHO EQUIVOCADO. El que rompe el servicio es el
      # DIARIO -`GenerateRequestsPerDayPerProjectPerModel-FreeTier`, 500
      # requests por dia-, y a la tarde el bot le contestaba a Martin "estoy
      # con mucha demanda" en 2 de 4 mensajes.
      #
      # Y hay una razon peor, que es la que decide: **el banco y produccion
      # compartian la misma clave gratis**. Las corridas de banco del dia se
      # comieron las 500 requests y le sacaron la cuota al bot vivo. Un banco
      # que deja mudo al producto no es un banco: es una caida.
      #
      # LAS CUENTAS, para que nadie lo vuelva a invertir sin datos: un turno
      # gasta de 2 a 4 requests, o sea que la gratis da entre 125 y 250 turnos
      # por dia CONTANDO TODO. Produccion sola en la paga cuesta centavos -son
      # 40.000 tokens de un modelo barato por turno-; los ~40 dolares que
      # Martin gasto en un mes fueron corridas de banco, no charlas de
      # clientes.
      #
      # SI EL SECRETO DE LA PAGA NO ESTA, NO SE TOCA LA ENV y el log lo grita.
      # Sin esa guarda, un secreto vacio dejaria a produccion con
      # GEMINI_API_KEY="" y el bot mudo, que es peor que cualquier factura.
      - name: Deploy a Cloud Run
        env:
          GEMINI_PAGA: ${{ secrets.GEMINI_API_KEY_PROD }}
        run: |
          CLAVE=""
          if [ -n "$GEMINI_PAGA" ]; then
            CLAVE="--update-env-vars=GEMINI_API_KEY=$GEMINI_PAGA"
            echo "Deploy con la clave PAGA de Gemini en produccion (lo que corresponde)."
          else
            echo "AVISO: no hay secreto GEMINI_API_KEY_PROD en el repo."
            echo "La env de produccion queda COMO ESTA, sin tocar."
            echo "Si el bot viene contestando 'estoy con mucha demanda', es que"
            echo "quedo con la clave gratis y su cuota diaria de 500 requests"
            echo "esta agotada. Se arregla cargando ese secreto en el repo, o a"
            echo "mano:  gcloud run services update agente-bot \\"
            echo "         --region southamerica-east1 --project memory-engine-v1 \\"
            echo "         --update-env-vars GEMINI_API_KEY=LA_CLAVE_PAGA"
          fi
          gcloud run deploy agente-bot \
            --region southamerica-east1 \
            --source . \
            --project memory-engine-v1 \
            --update-secrets=ADMIN_TOKEN=admin-token:latest \
            $CLAVE \
            --quiet

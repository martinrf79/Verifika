name: Deploy a Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'tests/**'
  workflow_dispatch:

jobs:
  # GATE de regresion: la bateria offline corre ANTES del deploy. Si un test
  # falla, este job queda rojo y el deploy (needs: test) NI ARRANCA. Asi una
  # regresion no puede llegar a produccion, sin depender de que nadie mire el CI.
  # Es el mismo piso offline de test.yml (Python puro, sin LLM ni credenciales).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Correr tests offline (sin LLM, sin credenciales)
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1000939441597/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@memory-engine-v1.iam.gserviceaccount.com

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: memory-engine-v1

      # ADMIN_TOKEN VIAJA EN EL DEPLOY, no se cablea a mano (4-ago-2026).
      #
      # Hasta hoy los endpoints de admin tenian un token por defecto escrito en
      # el codigo, asi que daba igual si la env estaba puesta: siempre habia
      # contraseña. Ahora, sin `ADMIN_TOKEN`, la puerta contesta 503. Si el
      # cableado dependiera de que alguien se acuerde de correr un `gcloud`
      # suelto, se pierde entre sesiones y el admin queda muerto sin que nadie
      # sepa por que.
      #
      # `--update-secrets` es IDEMPOTENTE y solo toca la que se nombra: agrega
      # ADMIN_TOKEN si falta, la deja igual si ya esta, y NO pisa las otras
      # -telegram-token, deepseek-key, sentry-dsn-. Correrlo de mas no rompe nada.
      #
      # Si el deploy falla aca por permisos, es que `github-deployer` no puede
      # leer el secreto. Se arregla con:
      #   gcloud secrets add-iam-policy-binding admin-token \
      #     --member=serviceAccount:github-deployer@memory-engine-v1.iam.gserviceaccount.com \
      #     --role=roles/secretmanager.secretAccessor --project=memory-engine-v1
      # PRODUCCION PASA A LA CLAVE GRATIS (Martin, 11-ago-2026). Venia con la
      # paga y Martin pidio la gratis para dejar de gastar. El secreto del repo
      # `GEMINI_API_KEY` YA es la gratis -es la que usa el nocturno de
      # calidad.yml- asi que la clave viaja en el deploy y no depende de que
      # alguien se acuerde de correr un gcloud suelto, que es como se pierde
      # entre sesiones.
      #
      # LO QUE HAY QUE SABER, con el numero medido el 11-ago: la gratis tiene un
      # techo de 250.000 tokens de ENTRADA por minuto y un turno consume entre
      # 18.000 y 35.000, o sea entre 7 y 13 turnos por minuto. Un cliente
      # escribiendo solo no llega ni cerca; varios a la vez, si. Cuando pega, el
      # turno contesta que hay demanda y pide reintentar —honesto, y desde hoy
      # ya NO le echa la culpa al catalogo—.
      #
      # SI EL SECRETO FALTA NO SE TOCA LA ENV. Sin esta guarda, un secreto vacio
      # dejaria a produccion con GEMINI_API_KEY="" y el bot mudo: peor que
      # cualquier factura.
      #
      # VOLVER A LA PAGA es una linea, y esa es la red:
      #   gcloud run services update agente-bot --region southamerica-east1 \
      #     --project memory-engine-v1 --update-env-vars GEMINI_API_KEY=<paga>
      - name: Deploy a Cloud Run
        env:
          GEMINI_GRATIS: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLAVE=""
          if [ -n "$GEMINI_GRATIS" ]; then
            CLAVE="--update-env-vars=GEMINI_API_KEY=$GEMINI_GRATIS"
            echo "Deploy con la clave GRATIS de Gemini en produccion."
          else
            echo "Sin secreto GEMINI_API_KEY: la env de produccion queda como esta."
          fi
          gcloud run deploy agente-bot \
            --region southamerica-east1 \
            --source . \
            --project memory-engine-v1 \
            --update-secrets=ADMIN_TOKEN=admin-token:latest \
            $CLAVE \
            --quiet

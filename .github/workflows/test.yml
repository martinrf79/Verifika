name: tests

# Bateria de regresion offline. Corre en cada push y en cada pull request.
# Es el juez externo: un rojo aca no se mergea, y no depende de la palabra de
# nadie. El piso offline es Python puro, no llama a ningun modelo ni necesita
# credenciales de Google, asi que corre gratis en los runners de GitHub.
#
# Los tests 'vivo' (que llaman a DeepSeek) NO corren aca: el default de pytest
# los excluye (-m 'not vivo' en pyproject.toml). Se disparan a mano cuando toca.
#
# Desde el 29-jul corre ademas EL TURNO COMPLETO sobre las charlas grabadas
# (tests/test_charlas_grabadas.py): el camino vivo entero con el modelo
# reemplazado por su casete, gratis y en segundos. De ahi sale EL NUMERO, el
# puntaje de 0 a 100 que queda impreso en el resumen de la corrida. La regla es
# una sola: el numero no baja.

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Correr tests offline (sin LLM, sin credenciales)
        run: pytest -v

      # EL NUMERO a la vista, sin tener que abrir el log: queda en el resumen de
      # la corrida, que es lo primero que se ve al entrar a Actions.
      - name: El numero de las charlas grabadas
        if: always()
        run: |
          pytest tests/test_charlas_grabadas.py::test_el_numero_no_baja \
            -q -p no:randomly 2>&1 | tee /tmp/numero.txt || true
          {
            echo "## Charlas grabadas"
            echo '```'
            grep -A 12 "EL NUMERO" /tmp/numero.txt || echo "sin casetes grabados"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

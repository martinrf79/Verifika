name: sonda de turno

# LA SONDA, CORRIENDO SOLA, CON LA SALIDA DONDE COWORK LA PUEDE LEER.
#
# POR QUE EXISTE (Martin, 9-sep-2026). El puente de logs ya trae produccion,
# pero la sonda -que muestra las ocho etapas del turno por dentro- la tenia que
# correr Martin a mano en Cloud Shell y pegar el resultado en el chat. Copiar y
# pegar pierde detalle, llega tarde, y cada sesion nueva arranca sin nada.
#
# ESTE WORKFLOW CIERRA ESO. Se pide con un comentario que empieza con /sonda en
# un issue; el workflow corre la sonda contra la fuente de verdad real y el
# modelo real, COMMITEA la salida completa en banco_pruebas/salidas/ -que Cowork
# lee del repo, sin tope de tamaño y para siempre- y ademas contesta en el issue
# con la cola del informe y el nombre del archivo.
#
# NADIE PEGA UNA CLAVE EN UN CHAT. Google entra por WIF, sin llave. La clave del
# modelo sale del secreto del repo y nunca se imprime: solo se dice si esta.
#
# NO DEPLOYA NADA. La salida va a banco_pruebas/, que esta en el paths-ignore de
# deploy.yml y en .gcloudignore. Y un push hecho con GITHUB_TOKEN no dispara
# otros workflows, asi que este commit no puede encadenar corridas.
#
# LA GUARDA: el repo es publico, asi que solo se atiende si el comentario lo
# escribio martinrf79.
#
# COMO SE PIDE
#   /sonda que garantia tienen las zapatillas talle 42 negras
#   /sonda usuario=5493547504287 cuanto sale el envio a cordoba
#   /sonda tienda=verifika_prod tope=6000 tu pregunta
#
#   usuario  reproduce sobre esa conversacion real de Firestore. Sin esto usa
#            un user_id de sonda y no pisa ninguna charla
#   tienda   TIENDA_ID a usar. Default verifika_prod
#   tope     caracteres por valor impreso en cada etapa. Default 2500

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Numero del issue donde dejar el informe"
        required: true
        default: "31"
      pedido:
        description: "Linea de pedido, ej: /sonda tu pregunta"
        required: true
        default: "/sonda"

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  sonda:
    if: >
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'martinrf79' &&
        startsWith(github.event.comment.body, '/sonda') )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Avisar que se recibio el pedido
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Sonda recibida. Corriendo: $CORRIDA"

      - name: Leer el pedido
        id: pedido
        env:
          # El cuerpo entra por env y NUNCA se interpola dentro del script: es
          # texto escrito desde un chat y interpolarlo seria darle una consola.
          CUERPO: ${{ github.event.comment.body || inputs.pedido }}
        run: |
          LINEA=$(printf '%s' "$CUERPO" | head -1)

          leer() { printf '%s' "$LINEA" | grep -oiE "(^|[[:space:]])$1=[^[:space:]]+" | head -1 | cut -d= -f2- ; }

          USUARIO=$(leer usuario | tr -dc '0-9')
          TIENDA=$(leer tienda | tr -dc 'A-Za-z0-9_-'); [ -z "$TIENDA" ] && TIENDA=verifika_prod
          TOPE=$(leer tope | tr -dc '0-9'); [ -z "$TOPE" ] && TOPE=2500
          [ "$TOPE" -gt 20000 ] && TOPE=20000

          # La pregunta es la linea sin el /sonda y sin los pares clave=valor.
          PREGUNTA=$(printf '%s' "$LINEA" \
            | sed -E 's@^/sonda[[:space:]]*@@' \
            | sed -E 's@(^|[[:space:]])(usuario|tienda|tope)=[^[:space:]]+@@g' \
            | sed -E 's@^[[:space:]]+|[[:space:]]+$@@g')

          if [ -z "$PREGUNTA" ]; then
            PREGUNTA="hola, que productos tienen"
            echo "Sin pregunta en el pedido: se usa una de cortesia."
          fi

          {
            echo "usuario=$USUARIO"
            echo "tienda=$TIENDA"
            echo "tope=$TOPE"
            echo "pregunta<<FIN"
            echo "$PREGUNTA"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - name: Autenticar a Google (WIF, sin llave)
        uses: google-github-actions/auth@v2
        with:
          project_id: memory-engine-v1
          workload_identity_provider: projects/1000939441597/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: claude-bridge@memory-engine-v1.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        # La lista entera, por lo mismo que ya documenta puente_cowork.yml: el
        # turno importa httpx, openai y tenacity en la cabecera de sus modulos,
        # y con una lista corta el informe vuelve con un ModuleNotFoundError en
        # lugar de una medicion.
        run: pip install --quiet -r requirements.txt

      - name: Correr la sonda
        env:
          # Si el secreto no esta, la sonda lo dice en su etapa cero y el
          # informe queda marcado como no valido. No se imprime la clave.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PROD }}
          GOOGLE_CLOUD_PROJECT: memory-engine-v1
          TIENDA_ID: ${{ steps.pedido.outputs.tienda }}
          PREGUNTA: ${{ steps.pedido.outputs.pregunta }}
          USUARIO: ${{ steps.pedido.outputs.usuario }}
          TOPE: ${{ steps.pedido.outputs.tope }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Secreto GEMINI_API_KEY_PROD: presente."
          else
            echo "AVISO: no hay secreto GEMINI_API_KEY_PROD en el repo."
            echo "La sonda va a correr sin modelo y el informe NO mide el codigo."
          fi
          ARGS="--tope $TOPE --json salida.json"
          [ -n "$USUARIO" ] && ARGS="$ARGS --user $USUARIO"
          # La pregunta va como argumento entre comillas, desde env.
          python3 banco_pruebas/sonda_turno.py $ARGS "$PREGUNTA" > sonda.txt 2>&1 || true
          echo "lineas de salida: $(wc -l < sonda.txt)"

      - name: Guardar la salida en el repo
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          mkdir -p banco_pruebas/salidas
          DEST="banco_pruebas/salidas/sonda_${RUN}.txt"
          cp sonda.txt "$DEST"
          [ -f salida.json ] && cp salida.json "banco_pruebas/salidas/sonda_${RUN}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banco_pruebas/salidas
          git commit -m "sonda: salida de la corrida ${RUN}" || echo "nada que commitear"
          # Rebase por si entro otro commit mientras corria la sonda.
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Contestar en el issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PREGUNTA: ${{ steps.pedido.outputs.pregunta }}
          RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY' > cuerpo.md
          import os
          import pathlib

          t = pathlib.Path("sonda.txt").read_text(encoding="utf-8", errors="replace")
          run = os.environ["RUN"]
          print("## Informe de la sonda\n")
          print("Pregunta: `" + os.environ.get("PREGUNTA", "") + "`\n")
          print("Salida completa en el repo, sin recortar:")
          print("`banco_pruebas/salidas/sonda_" + run + ".txt`")
          print("y el capturado en `banco_pruebas/salidas/sonda_" + run + ".json`\n")
          print("Largo total: " + str(len(t)) + " caracteres.\n")
          # En el comentario va la COLA: ahi estan las ultimas etapas, la
          # respuesta final y los avisos. Lo de arriba se lee del archivo.
          tope = 50000
          if len(t) > tope:
              print("_Recortado para el comentario: se muestran los ultimos "
                    + str(tope) + " caracteres. El archivo del repo esta entero._\n")
              t = t[-tope:]
          print("```")
          print(t.rstrip())
          print("```")
          PY
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file cuerpo.md
